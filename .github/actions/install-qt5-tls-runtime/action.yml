name: Install Qt 5 TLS runtime
description: Build the OpenSSL 1.1 runtime required by the Qt 5.15.2 binary packages.
runs:
  using: composite
  steps:
    - name: Cache TLS runtime
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/qt5-openssl
        key: qt5-openssl-1.1.1w-${{ runner.os }}-${{ runner.arch }}-v1

    - name: Download OpenSSL 1.1.1w
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        curl -fL --retry 3 https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz -o openssl-1.1.1w.tar.gz
        echo 'cf3098950cb4d853ad95c0841f1f9c6d3dc102dccfcacd521d93925208b76ac8  openssl-1.1.1w.tar.gz' | sha256sum --check
        tar -xzf openssl-1.1.1w.tar.gz

    - name: Build Linux runtime
      if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}/openssl-1.1.1w
      run: |
        ./config shared no-tests --prefix="$RUNNER_TEMP/qt5-openssl" --libdir=lib
        make -j"$(nproc)"
        make install_sw

    - name: Build Windows runtime
      if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      working-directory: ${{ runner.temp }}/openssl-1.1.1w
      run: |
        perl Configure VC-WIN64A shared no-asm no-tests --prefix="$env:RUNNER_TEMP/qt5-openssl"
        if ($LASTEXITCODE -ne 0) { throw 'OpenSSL configuration failed' }
        nmake /NOLOGO
        if ($LASTEXITCODE -ne 0) { throw 'OpenSSL build failed' }
        nmake /NOLOGO install_sw
        if ($LASTEXITCODE -ne 0) { throw 'OpenSSL installation failed' }

    - name: Configure Linux loader
      if: runner.os == 'Linux'
      shell: bash
      run: |
        test -f "$RUNNER_TEMP/qt5-openssl/lib/libssl.so.1.1"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/qt5-openssl/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

    - name: Configure Windows loader
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (!(Test-Path "$env:RUNNER_TEMP/qt5-openssl/bin/libssl-1_1-x64.dll")) {
          throw 'Qt 5 TLS runtime is missing'
        }
        "$env:RUNNER_TEMP/qt5-openssl/bin" >> $env:GITHUB_PATH
