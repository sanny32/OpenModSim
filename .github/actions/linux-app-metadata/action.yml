name: Render Linux app metadata
description: Rename Linux icons and render desktop and metainfo files.

inputs:
  root-dir:
    description: Root directory containing usr/share metadata files.
    required: true
  app-install-prefix:
    description: Application installation prefix.
    required: true
  version-major:
    description: Application major version.
    required: true
  product-name:
    description: Product display name.
    required: true
  app-version:
    description: Application package version.
    required: true
  ref-name:
    description: Git ref name for metainfo release URL.
    required: true
  ref-type:
    description: Git ref type for metainfo release URL.
    required: true
  appimage:
    description: Use the AppStream component ID as the AppImage desktop file basename.
    default: "false"

outputs:
  desktop-file:
    description: Rendered desktop file name.
    value: ${{ steps.render.outputs.desktop-file }}

runs:
  using: composite
  steps:
    - name: Render Linux app metadata
      id: render
      shell: bash
      env:
        ROOT_DIR: ${{ inputs.root-dir }}
        VERSION_MAJOR: ${{ inputs.version-major }}
        PRODUCT_NAME: ${{ inputs.product-name }}
        APP_VERSION: ${{ inputs.app-version }}
        REF_NAME: ${{ inputs.ref-name }}
        REF_TYPE: ${{ inputs.ref-type }}
        APPIMAGE: ${{ inputs.appimage }}
      run: |
        set -euo pipefail

        share_dir="$ROOT_DIR/usr/share"
        app_name="$PRODUCT_NAME $VERSION_MAJOR"

        component_id="io.github.sanny32.OpenModSim$VERSION_MAJOR"
        icon_name="omodsim$VERSION_MAJOR"
        app_exec="$icon_name"
        desktop_file="$app_exec.desktop"
        metainfo_file="$component_id.metainfo.xml"

        # appimagetool looks up <desktop basename>.appdata.xml before validating the AppDir.
        if [[ "$APPIMAGE" == true ]]; then
          app_exec=omodsim
          desktop_file="$component_id.desktop"
          metainfo_file="$component_id.appdata.xml"
        fi

        for size in 16x16 32x32 64x64 128x128; do
          icon_dir="$share_dir/icons/hicolor/$size/apps"
          mv "$icon_dir/omodsim.png" "$icon_dir/$icon_name.png"
        done

        metainfo_template="$share_dir/metainfo/omodsim.metainfo.xml.in"
        metainfo_path="$share_dir/metainfo/$metainfo_file"
        sed -e "s|@REF_NAME@|$REF_NAME|g" \
            -e "s|@REF_TYPE@|$REF_TYPE|g" \
            -e "s|@COMPONENT_ID@|$component_id|g" \
            -e "s|@DESKTOP_FILE@|$desktop_file|g" \
            -e "s|@APP_NAME@|$app_name|g" \
            -e "s|@APP_EXEC@|$app_exec|g" \
            -e "s|@APP_VERSION@|$APP_VERSION|g" \
            -e "s|@BUILD_DATE@|$(date +%Y-%m-%d)|g" \
            "$metainfo_template" > "$metainfo_path"
        rm "$metainfo_template"
        cat -n "$metainfo_path"

        desktop_template="$share_dir/applications/omodsim.desktop.in"
        desktop_path="$share_dir/applications/$desktop_file"
        sed -e "s|@APP_NAME@|$app_name|g" \
            -e "s|@APP_EXEC@|$app_exec|g" \
            -e "s|@APP_ICON@|$icon_name|g" \
            "$desktop_template" > "$desktop_path"
        rm "$desktop_template"
        cat -n "$desktop_path"

        printf 'desktop-file=%s\n' "$desktop_file" >> "$GITHUB_OUTPUT"
