name: Trust RED SOFT registry
description: Let the Docker daemon pull images from registry.red-soft.ru.

runs:
  using: composite
  steps:
    # The registry serves the 2022 Russian Trusted Sub CA, but its certificate is signed by the 2024 one.
    - name: Install registry CA certificates
      shell: bash
      run: |
        sudo install -D -m 644 "$GITHUB_ACTION_PATH/ca.crt" /etc/docker/certs.d/registry.red-soft.ru/ca.crt
