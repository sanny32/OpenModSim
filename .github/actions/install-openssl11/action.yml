name: Install OpenSSL 1.1
description: Install the shared development and TLS libraries used by Qt 5 builds.
inputs:
  architecture:
    description: Windows target architecture, x64 or x86.
    default: x64
runs:
  using: composite
  steps:
    - name: Cache Linux OpenSSL
      if: runner.os == 'Linux'
      id: linux-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/qt5-openssl
        key: qt5-openssl-1.1.1w-${{ runner.os }}-${{ runner.arch }}-v1

    - name: Build Linux OpenSSL
      if: runner.os == 'Linux' && steps.linux-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        source_root=$(python3 tools/fetch_openssl11.py "$RUNNER_TEMP/openssl11-src")
        bash tools/build_openssl.sh "$source_root" "$RUNNER_TEMP/qt5-openssl" 1.1

    - name: Configure Linux loader and build
      if: runner.os == 'Linux'
      shell: bash
      run: |
        test -f "$RUNNER_TEMP/qt5-openssl/lib/libssl.so.1.1"
        echo "OPENSSL_ROOT_DIR=$RUNNER_TEMP/qt5-openssl" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/qt5-openssl/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

    - name: Cache Windows OpenSSL
      if: runner.os == 'Windows'
      id: windows-cache
      uses: actions/cache/restore@v4
      with:
        path: C:/Qt/Tools/OpenSSL11/Win_${{ inputs.architecture }}
        key: openssl-1.1.1w-Windows-${{ inputs.architecture }}-v1

    - name: Install Windows OpenSSL
      if: runner.os == 'Windows'
      uses: ./.github/actions/install-openssl
      with:
        version: '1.1'
        architecture: ${{ inputs.architecture }}

    - name: Save Windows OpenSSL
      if: runner.os == 'Windows' && steps.windows-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: C:/Qt/Tools/OpenSSL11/Win_${{ inputs.architecture }}
        key: openssl-1.1.1w-Windows-${{ inputs.architecture }}-v1
